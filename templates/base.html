<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YG1 Monitoring{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --success: #16a34a;
            --success-light: #dcfce7;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --info: #0891b2;
            --info-light: #cffafe;
            --purple: #7c3aed;
            --purple-light: #ede9fe;
            --dark: #0f172a;
            --gray: #f1f5f9;
            --gray-border: #e2e8f0;
            --text: #334155;
            --text-light: #64748b;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --shadow-lg: 0 10px 25px rgba(0,0,0,.12);
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--gray);
            color: var(--text);
            min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        /* ── Auth pages (login/register) ── */
        .auth-body {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            width: 100%;
            max-width: 420px;
            padding: 40px 36px;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-logo .logo-badge {
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(37,99,235,.35);
            overflow: hidden;
            padding: 0;
        }
        .auth-logo .logo-badge img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 14px;
            display: block;
        }
        .auth-logo h1 { font-size: 22px; font-weight: 800; color: var(--dark); }
        .auth-logo p { font-size: 13px; color: var(--text-light); margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--gray-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border .2s, box-shadow .2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,.15);
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: background .2s, transform .1s, box-shadow .2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 2px 6px rgba(37,99,235,.3); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #b45309; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-outline { background: white; color: var(--text); border: 1.5px solid var(--gray-border); }
        .btn-outline:hover { background: var(--gray); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-block { width: 100%; }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .remember-row label { display: flex; align-items: center; gap: 6px; color: var(--text); cursor: pointer; }
        .remember-row input { accent-color: var(--primary); }
        .remember-row a { color: var(--primary); font-weight: 600; }
        .remember-row a:hover { text-decoration: underline; }

        /* Flash messages */
        .flash-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 420px;
            width: calc(100% - 40px);
        }
        .flash {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.06);
            animation: flashIn .4s cubic-bezier(.175,.885,.32,1.275);
            position: relative;
            overflow: hidden;
        }
        .flash::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
        }
        .flash-success {
            background: #f0fdf4;
            color: #166534;
        }
        .flash-success::before { background: var(--success); }
        .flash-success .flash-icon { color: var(--success); }

        .flash-error {
            background: #fef2f2;
            color: #991b1b;
        }
        .flash-error::before { background: var(--danger); }
        .flash-error .flash-icon { color: var(--danger); }

        .flash-warning {
            background: #fffbeb;
            color: #92400e;
        }
        .flash-warning::before { background: var(--warning); }
        .flash-warning .flash-icon { color: var(--warning); }

        .flash-info {
            background: #ecfeff;
            color: #155e75;
        }
        .flash-info::before { background: var(--info); }
        .flash-info .flash-icon { color: var(--info); }

        .flash-icon {
            font-size: 18px;
            line-height: 1;
            flex-shrink: 0;
        }
        .flash-text { flex: 1; line-height: 1.4; }
        .flash-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: inherit;
            opacity: .5;
            padding: 0 2px;
            line-height: 1;
            transition: opacity .2s;
        }
        .flash-close:hover { opacity: 1; }
        @keyframes flashIn {
            from { opacity: 0; transform: translateX(40px) scale(.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes flashOut {
            to { opacity: 0; transform: translateX(40px) scale(.95); }
        }
        .flash.removing { animation: flashOut .3s ease forwards; pointer-events: none; }

        /* ── Sidebar layout ── */
        .layout { display: flex; height: 100vh; overflow: hidden; }
        .sidebar {
            width: 240px;
            background: var(--dark);
            color: #cbd5e1;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 100;
        }
        .sidebar .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; padding: 0 8px; }
        .sidebar .brand .badge {
            width: 38px; height: 38px;
            background: var(--primary);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 18px; color: white;
            overflow: hidden;
            padding: 0;
        }
        .sidebar .brand .badge img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }
        .sidebar .brand h2 { font-size: 16px; font-weight: 700; color: white; }
        .sidebar .brand small { display: block; font-size: 11px; color: #94a3b8; font-weight: 400; margin-top: 2px; }
        .sidebar nav { flex: 1; }
        .sidebar nav .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; padding: 12px 10px 6px; }
        .sidebar nav a {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
            transition: background .2s, color .2s;
            margin-bottom: 2px;
        }
        .sidebar nav a:hover { background: rgba(255,255,255,.08); color: white; }
        .sidebar nav a.active { background: var(--primary); color: white; box-shadow: 0 2px 8px rgba(37,99,235,.4); }
        .sidebar nav a .icon { font-size: 18px; width: 22px; text-align: center; }
        .sidebar .user-box {
            border-top: 1px solid rgba(255,255,255,.1);
            padding-top: 16px;
            margin-top: auto;
        }
        .sidebar .user-box .user-info { padding: 0 10px; margin-bottom: 10px; }
        .sidebar .user-box .user-info strong { display: block; color: white; font-size: 14px; }
        .sidebar .user-box .user-info span { font-size: 12px; color: #94a3b8; }

        /* ── Main content ── */
        .main { flex: 1; margin-left: 240px; padding: 32px 36px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
        .page-header h1 { font-size: 24px; font-weight: 800; color: var(--dark); }
        .page-header p { font-size: 14px; color: var(--text-light); margin-top: 4px; }
        .page-header .actions { display: flex; gap: 10px; }

        /* Cards & stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }
        .stat-card.green { border-left-color: var(--success); }
        .stat-card.red { border-left-color: var(--danger); }
        .stat-card.amber { border-left-color: var(--warning); }
        .stat-card.blue { border-left-color: var(--info); }
        .stat-card.purple { border-left-color: var(--purple); }
        .stat-card .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); }
        .stat-card .value { font-size: 30px; font-weight: 800; color: var(--dark); margin-top: 6px; }
        .stat-card .sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }

        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
        }
        .card h3 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; }
        .chart-box { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
        .chart-box h3 { font-size: 15px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }
        .chart-box canvas { max-height: 280px; }

        /* Tables */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead th {
            text-align: left;
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-light);
            background: var(--gray);
            border-bottom: 2px solid var(--gray-border);
            white-space: nowrap;
        }
        tbody td { padding: 14px; border-bottom: 1px solid var(--gray-border); vertical-align: middle; }
        tbody tr:hover { background: #f8fafc; }
        tbody tr:last-child td { border-bottom: none; }

        /* Scrollable table (placements) - fixed height, scrolls vertically & horizontally */
        .table-scroll {
            overflow: auto;
            max-height: 280px;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
        }
        .table-scroll table { border-collapse: separate; border-spacing: 0; }
        .table-scroll thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 1px 0 var(--gray-border);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-open { background: var(--danger-light); color: #991b1b; }
        .badge-closed { background: var(--success-light); color: #166534; }
        .badge-plant1 { background: #dbeafe; color: #1e40af; }
        .badge-plant2 { background: #fef3c7; color: #92400e; }
        .badge-plant3 { background: #fce7f3; color: #9d174d; }
        .badge-compliant { background: var(--success-light); color: #166534; }
        .badge-violation { background: var(--danger-light); color: #991b1b; }
        .badge-admin { background: var(--primary-light); color: var(--primary-dark); }
        .badge-coordinator { background: var(--info-light); color: #155e75; }
        .badge-active { background: var(--success-light); color: #166534; }
        .badge-inactive { background: #e2e8f0; color: #475569; }
        .badge-pending { background: var(--warning-light); color: #92400e; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
        .empty-state .icon { font-size: 44px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        .link-btn {
            background: none; border: none;
            color: var(--primary); font-size: 13px; font-weight: 600;
            padding: 4px 8px; border-radius: 6px;
            transition: background .2s;
        }
        .link-btn:hover { background: var(--primary-light); }
        .link-btn.danger { color: var(--danger); }
        .link-btn.danger:hover { background: var(--danger-light); }

        .alerts-list { display: flex; flex-direction: column; gap: 8px; }
        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #fff7ed;
            border-left: 4px solid var(--warning);
            padding: 12px 14px;
            border-radius: 8px;
        }
        .alert-item.resolved { background: var(--success-light); border-left-color: var(--success); }
        .alert-item .alert-icon { font-size: 20px; line-height: 1.4; }
        .alert-item .alert-content { flex: 1; min-width: 0; }
        .alert-item .alert-content strong { font-size: 13px; color: var(--dark); display: block; margin-bottom: 2px; }
        .alert-item .alert-content span { font-size: 12px; color: var(--text-light); display: block; }
        .alert-item .alert-content .alert-meta { margin-top: 4px; font-size: 11px; color: #94a3b8; }
        .alert-item .alert-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .alerts-scroll { overflow: auto; max-height: 420px; border: 1px solid var(--gray-border); border-radius: 8px; padding: 10px; }
        .alerts-scroll .alerts-list { gap: 8px; }

        .rule-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .rule-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 22px;
            border-top: 4px solid var(--primary);
            transition: transform .2s, box-shadow .2s;
        }
        .rule-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .rule-card h4 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
        .rule-card .meta { font-size: 13px; color: var(--text-light); margin-bottom: 6px; }
        .rule-card .meta strong { color: var(--text); }
        .rule-card .rule-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gray-border); }

        .counts-inline {
            display: flex; gap: 16px; margin-top: 10px;
            font-size: 13px;
        }
        .counts-inline span { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-red { background: var(--danger); }
        .dot-green { background: var(--success); }
        .dot-amber { background: var(--warning); }

        @media (max-width: 1024px) {
            .sidebar { width: 60px; padding: 24px 10px; }
            .sidebar .brand h2, .sidebar .brand small, .sidebar .nav-label, .sidebar nav a span:not(.icon), .sidebar .user-info { display: none; }
            .sidebar nav a { justify-content: center; }
            .main { margin-left: 60px; padding: 24px 16px; }
            .charts-grid { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .page-header .actions { width: 100%; justify-content: flex-end; }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 280px;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: var(--shadow-lg);
            }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 16px; height: auto; min-height: 100vh; padding-top: 72px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .stat-card .value { font-size: 24px; }
            .rule-cards { grid-template-columns: 1fr; }
            .charts-grid { grid-template-columns: 1fr; }
            .table-wrap, .table-scroll { border: none; }
            thead { display: none; }
            tbody, tbody tr, tbody td { display: block; width: 100%; }
            tbody tr { margin-bottom: 16px; padding: 16px; background: white; border-radius: var(--radius); box-shadow: var(--shadow); }
            tbody td { padding: 8px 0; border-bottom: 1px solid var(--gray-border); display: flex; justify-content: space-between; align-items: center; }
            tbody td:last-child { border-bottom: none; }
            tbody td::before { content: attr(data-label); font-weight: 600; color: var(--text-light); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
            .alert-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .alert-item .alert-actions { width: 100%; justify-content: flex-end; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .page-header .actions { width: 100%; justify-content: flex-end; }
            .flash-container { top: 10px; right: 10px; left: 10px; max-width: none; width: auto; }
            .form-group input, .form-group select, .form-group textarea { font-size: 16px; }
            .btn-block { width: 100%; }
            .modal-box { margin: 10px; }
            .auth-card { padding: 24px 20px; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .stat-card { padding: 16px; }
            .stat-card .value { font-size: 22px; }
            .card, .chart-box { padding: 16px; }
            .page-header h1 { font-size: 20px; }
            .sidebar { width: 100%; max-width: 280px; }
            .auth-card { margin: 10px; }
            .btn { padding: 12px 16px; }
            .btn-sm { padding: 8px 12px; font-size: 13px; }
            .rule-card { padding: 16px; }
            .form-group input, .form-group select, .form-group textarea { padding: 14px 16px; }
            .flash { padding: 12px 14px; }
        }

        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 200;
            width: 44px;
            height: 44px;
            background: var(--dark);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.5);
            z-index: 99;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }
        @media (max-width: 768px) {
            .mobile-menu-btn { display: flex; }
        }
        .auth-body .mobile-menu-btn { display: none !important; }

        /* Timeout Warning Notification */
        .timeout-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100001;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,.2);
            padding: 20px 24px;
            max-width: 380px;
            width: calc(100% - 40px);
            display: none;
            align-items: flex-start;
            gap: 14px;
            border-left: 4px solid var(--warning);
            animation: slideInRight .4s cubic-bezier(.175,.885,.32,1.275);
        }
        .timeout-notification.active { display: flex; }
        .timeout-notification .timeout-icon { font-size: 28px; flex-shrink: 0; }
        .timeout-notification .timeout-content { flex: 1; }
        .timeout-notification .timeout-content h4 { font-size: 15px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
        .timeout-notification .timeout-content p { font-size: 13px; color: var(--text-light); margin-bottom: 10px; line-height: 1.4; }
        .timeout-notification .timeout-timer { font-size: 28px; font-weight: 800; color: var(--warning); margin-bottom: 12px; }
        .timeout-notification .timeout-actions { display: flex; gap: 8px; }
        .timeout-notification .timeout-actions .btn { padding: 8px 16px; font-size: 13px; }
        .timeout-notification .timeout-close {
            background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-light);
            padding: 0; line-height: 1; transition: color .2s;
        }
        .timeout-notification .timeout-close:hover { color: var(--dark); }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed; inset: 0;
            background: rgba(255,255,255,.85);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(2px);
        }
        .loading-overlay.active { display: flex; }
        .loading-spinner {
            width: 48px; height: 48px;
            border: 4px solid var(--gray-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text { font-size: 14px; font-weight: 600; color: var(--text); }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Confirm Modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(15,23,42,.5);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.active { display: flex; animation: fadeIn .2s ease; }
        .modal-box {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,.25);
            width: 100%; max-width: 400px;
            padding: 28px;
            text-align: center;
            animation: scaleIn .25s cubic-bezier(.175,.885,.32,1.275);
        }
        .modal-box .modal-icon { font-size: 48px; margin-bottom: 14px; }
        .modal-box h3 { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
        .modal-box p { font-size: 14px; color: var(--text-light); margin-bottom: 22px; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-actions .btn { min-width: 100px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block mobile_menu_btn %}
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    {% endblock %}
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading...</div>
    </div>
    <div class="timeout-notification" id="timeoutNotification">
        <div class="timeout-icon">⏰</div>
        <div class="timeout-content">
            <h4>Session Expiring Soon</h4>
            <p>You will be logged out due to inactivity in <span id="timeoutTimer">60</span> seconds.</p>
            <div class="timeout-timer" id="timeoutTimerDisplay">60</div>
            <div class="timeout-actions">
                <button class="btn btn-outline" id="timeoutCancel">Logout Now</button>
                <button class="btn btn-primary" id="timeoutStay">Stay Logged In</button>
            </div>
        </div>
        <button class="timeout-close" id="timeoutClose">&times;</button>
    </div>
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <h3>Confirm Delete</h3>
            <p id="confirmModalText">Are you sure you want to delete this?</p>
            <div class="modal-actions">
                <button class="btn btn-outline" id="confirmModalCancel">Cancel</button>
                <button class="btn btn-danger" id="confirmModalOk">Delete</button>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            function showLoading() {
                if (loadingOverlay) loadingOverlay.classList.add('active');
            }
            function hideLoading() {
                if (loadingOverlay) loadingOverlay.classList.remove('active');
            }
            window.addEventListener('load', hideLoading);
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                if (!link) return;
                if (link.classList.contains('no-loading')) return;
                if (link.getAttribute('href') && link.getAttribute('href').startsWith('#')) return;
                if (link.getAttribute('target') === '_blank') return;
                if (link.getAttribute('role') === 'button' && link.getAttribute('data-bs-toggle') === 'collapse') return;
                showLoading();
            });
            document.addEventListener('submit', function(e) {
                const form = e.target;
                if (form && !form.classList.contains('no-loading')) {
                    showLoading();
                }
            });

            // Idle timeout: 5 minutes idle, warn at 4 minutes
            const IDLE_LIMIT = 5 * 60 * 1000;
            const WARN_AT = 4 * 60 * 1000;
            let idleTimer = null;
            let warnTimer = null;
            let countdownInterval = null;
            const timeoutNotification = document.getElementById('timeoutNotification');
            const timeoutTimerEl = document.getElementById('timeoutTimer');
            const timeoutTimerDisplay = document.getElementById('timeoutTimerDisplay');
            const timeoutStayBtn = document.getElementById('timeoutStay');
            const timeoutCancelBtn = document.getElementById('timeoutCancel');
            const timeoutCloseBtn = document.getElementById('timeoutClose');

            function resetIdleTimer() {
                clearTimeout(idleTimer);
                clearTimeout(warnTimer);
                clearInterval(countdownInterval);
                hideTimeoutNotification();
                warnTimer = setTimeout(showTimeoutWarning, WARN_AT);
                idleTimer = setTimeout(logoutDueToIdle, IDLE_LIMIT);
            }

            function showTimeoutWarning() {
                if (!timeoutNotification) return;
                timeoutNotification.classList.add('active');
                let remaining = 60;
                if (timeoutTimerEl) timeoutTimerEl.textContent = remaining;
                if (timeoutTimerDisplay) timeoutTimerDisplay.textContent = remaining;
                countdownInterval = setInterval(function() {
                    remaining -= 1;
                    if (timeoutTimerEl) timeoutTimerEl.textContent = remaining;
                    if (timeoutTimerDisplay) timeoutTimerDisplay.textContent = remaining;
                    if (remaining <= 0) {
                        clearInterval(countdownInterval);
                        logoutDueToIdle();
                    }
                }, 1000);
            }

            function hideTimeoutNotification() {
                if (timeoutNotification) timeoutNotification.classList.remove('active');
            }

            function logoutDueToIdle() {
                clearTimeout(idleTimer);
                clearTimeout(warnTimer);
                clearInterval(countdownInterval);
                hideTimeoutNotification();
                window.location.href = '/logout';
            }

            ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(function(evt) {
                document.addEventListener(evt, function() {
                    if (timeoutNotification && timeoutNotification.classList.contains('active')) return;
                    resetIdleTimer();
                });
            });

            if (timeoutStayBtn) {
                timeoutStayBtn.addEventListener('click', function() {
                    resetIdleTimer();
                });
            }
            if (timeoutCancelBtn) {
                timeoutCancelBtn.addEventListener('click', function() {
                    logoutDueToIdle();
                });
            }
            if (timeoutCloseBtn) {
                timeoutCloseBtn.addEventListener('click', function() {
                    logoutDueToIdle();
                });
            }
            resetIdleTimer();

            const flashes = document.querySelectorAll('.flash');
            flashes.forEach(f => {
                const closeBtn = f.querySelector('.flash-close');
                if (closeBtn) {
                    closeBtn.addEventListener('click', () => removeFlash(f));
                }
                setTimeout(() => removeFlash(f), 4000);
            });
            function removeFlash(el) {
                if (el.classList.contains('removing')) return;
                el.classList.add('removing');
                el.addEventListener('animationend', () => el.remove());
            }

            let pendingForm = null;
            const modal = document.getElementById('confirmModal');
            const modalText = document.getElementById('confirmModalText');
            const btnOk = document.getElementById('confirmModalOk');
            const btnCancel = document.getElementById('confirmModalCancel');

            document.querySelectorAll('[data-confirm]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    pendingForm = this.closest('form');
                    modalText.textContent = this.getAttribute('data-confirm') || 'Are you sure?';
                    modal.classList.add('active');
                });
            });

            btnOk.addEventListener('click', function() {
                if (pendingForm) pendingForm.submit();
            });
            btnCancel.addEventListener('click', function() {
                modal.classList.remove('active');
                pendingForm = null;
            });
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.classList.remove('active');
                    pendingForm = null;
                }
            });

            // Mobile sidebar toggle
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const sidebar = document.querySelector('.sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            
            if (mobileMenuBtn && sidebar && sidebarOverlay) {
                mobileMenuBtn.addEventListener('click', function() {
                    sidebar.classList.toggle('open');
                    sidebarOverlay.classList.toggle('active');
                });
                sidebarOverlay.addEventListener('click', function() {
                    sidebar.classList.remove('open');
                    sidebarOverlay.classList.remove('active');
                });
                // Close sidebar when clicking a nav link on mobile
                sidebar.querySelectorAll('nav a').forEach(link => {
                    link.addEventListener('click', function() {
                        if (window.innerWidth <= 768) {
                            sidebar.classList.remove('open');
                            sidebarOverlay.classList.remove('active');
                        }
                    });
                });
            }
        })();
    </script>
</body>
</html>
