<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YG1 Monitoring{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --success: #16a34a;
            --success-light: #dcfce7;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --info: #0891b2;
            --info-light: #cffafe;
            --purple: #7c3aed;
            --purple-light: #ede9fe;
            --dark: #0f172a;
            --gray: #f1f5f9;
            --gray-border: #e2e8f0;
            --text: #334155;
            --text-light: #64748b;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --shadow-lg: 0 10px 25px rgba(0,0,0,.12);
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background-color: #eef2f7;
            background-image:
                radial-gradient(circle at 10% -12%, rgba(37,99,235,.12) 0%, transparent 46%),
                radial-gradient(circle at 90% 2%, rgba(245,197,32,.16) 0%, transparent 44%),
                radial-gradient(circle at 72% 108%, rgba(13,148,136,.10) 0%, transparent 46%),
                linear-gradient(rgba(15,23,42,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15,23,42,.035) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 44px 44px, 44px 44px;
            background-attachment: fixed;
        }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        /* ── Auth pages (login/register) ── */
        .auth-body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #33415d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: visible;
        }
        .auth-body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 35%, rgba(96,165,250,.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(147,51,234,.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 15%, rgba(34,197,94,.06) 0%, transparent 50%);
            pointer-events: none;
        }
        .auth-body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        /* ── Split-screen auth pages (login / register) ── */
        .auth-split-body {
            display: flex !important;
            align-items: center;
            justify-content: center;
            padding: 0 !important;
            background-color: #0b0e13;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(245,197,32,.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(37,99,235,.14) 0%, transparent 50%),
                url("{{ url_for('static', filename='images/yg1_images.webp') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }
        .auth-split-body::before, .auth-split-body::after { display: none; }

        .auth-split {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: clamp(16px, 2vw, 32px);
        }

        /* Left: industrial brand panel */
        .auth-brand {
            position: relative;
            overflow: hidden;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: clamp(6px, 1.6vh, 4vh);
            padding: clamp(14px, 2.8vh, 48px) clamp(20px, 3vw, 56px);
            background-color: #0b0e13;
            background-image:
                radial-gradient(circle at 74% 22%, rgba(245,197,32,.20) 0%, transparent 48%),
                radial-gradient(circle at 10% 90%, rgba(37,99,235,.14) 0%, transparent 52%),
                linear-gradient(140deg, rgba(11,14,19,.72) 0%, rgba(11,14,19,.86) 45%, rgba(11,14,19,.94) 100%),
                url("{{ url_for('static', filename='images/auth_machining_bg.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .auth-brand::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
            background-size: 56px 56px;
            pointer-events: none;
        }
        .auth-brand::after {
            content: '';
            position: absolute;
            inset: -20% -40%;
            background: linear-gradient(105deg, transparent 42%, rgba(245,197,32,.10) 50%, transparent 58%);
            transform: rotate(8deg);
            pointer-events: none;
        }
        .auth-brand > * { position: relative; z-index: 2; }

        .brand-top { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; }
        .brand-mark {
            width: clamp(36px, 5.4vh, 62px); height: clamp(36px, 5.4vh, 62px);
            flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(145deg, #f5c520, #d99b06);
            border-radius: clamp(10px, 1.4vh, 14px);
            box-shadow: 0 10px 28px rgba(245,197,32,.30);
            padding: clamp(7px, 1.1vh, 12px);
        }
        .brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .brand-top .brand-name {
            font-size: clamp(13px, 1.8vh, 19px); font-weight: 800; color: #fff; letter-spacing: 2.5px;
        }
        .brand-top .brand-sub {
            font-size: clamp(8px, 1.05vh, 11px); font-weight: 600; color: #f5c520;
            letter-spacing: 2px; text-transform: uppercase; margin-top: 3px;
        }

        .brand-copy { min-height: 0; }
        .brand-copy h1 {
            font-size: clamp(22px, 4.6vh, 56px);
            line-height: 1.05;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }
        .brand-copy h1 span {
            display: block;
            background: linear-gradient(95deg, #ffd75e, #f5c520 55%, #e0a800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-copy .brand-rule {
            width: clamp(48px, 7vh, 72px); height: 4px; border-radius: 3px;
            background: linear-gradient(90deg, #f5c520, transparent);
            margin: clamp(6px, 1.7vh, 22px) 0;
        }
        .brand-copy p.tagline {
            font-size: clamp(11.5px, 1.75vh, 17px); line-height: 1.55; color: #cbd5e1;
            max-width: 460px; font-weight: 400;
        }
        .brand-chips {
            display: flex; flex-wrap: wrap; gap: 8px;
            margin-top: clamp(8px, 2.2vh, 32px);
        }
        .brand-chip {
            display: inline-flex; align-items: center; gap: 7px;
            padding: clamp(4px, 0.8vh, 9px) 14px;
            border: 1px solid rgba(245,197,32,.28);
            background: rgba(245,197,32,.07);
            border-radius: 999px;
            font-size: clamp(9px, 1.15vh, 12px); font-weight: 600; color: #e8edf3;
            letter-spacing: .4px;
        }
        .brand-chip i { color: #f5c520; font-style: normal; }

        .brand-foot {
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; flex-wrap: wrap;
            font-size: clamp(8.5px, 1.1vh, 12px); color: #7b8794;
            border-top: 1px solid rgba(255,255,255,.08);
            padding-top: clamp(6px, 1.6vh, 22px);
            flex: 0 0 auto;
        }
        .brand-foot .lock { display: inline-flex; align-items: center; gap: 8px; }

        /* decorative cutting-tool / gear artwork */
        .brand-art {
            position: absolute;
            right: -140px; bottom: -120px;
            width: 520px; height: 520px;
            opacity: .13;
            color: #f5c520;
            z-index: 1;
            pointer-events: none;
        }

        /* Right: form panel. */
        .auth-form-side {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 460px;
            padding: 0;
            background: transparent;
        }
        .auth-panel {
            width: 100%;
            max-width: 430px;
            background: rgba(11, 14, 19, 0.85);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(245, 197, 32, 0.25);
            border-radius: clamp(14px, 2vw, 20px);
            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.45),
                0 4px 12px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: clamp(14px, 2.6vh, 40px) clamp(16px, 2.4vw, 38px) clamp(12px, 2.2vh, 32px);
            position: relative;
        }
        /* machined gold accent along the top edge of the card */
        .auth-panel::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 3px;
            border-radius: clamp(14px, 2vw, 20px) clamp(14px, 2vw, 20px) 0 0;
            background: linear-gradient(90deg, #f5c520, #f0b400 45%, rgba(37,99,235,.85) 100%);
        }
        .auth-panel.wide { max-width: 620px; }
        .auth-panel-head { text-align: center; margin-bottom: clamp(8px, 1.9vh, 28px); }
        .panel-icon {
            width: clamp(34px, 5.2vh, 64px); height: clamp(34px, 5.2vh, 64px);
            margin: 0 auto clamp(6px, 1.3vh, 18px);
            display: flex; align-items: center; justify-content: center;
            border-radius: clamp(12px, 1.6vw, 18px);
            color: #f5c520;
            background: linear-gradient(145deg, #1a2029, #0b0e13);
            box-shadow: 0 10px 24px rgba(15,23,42,.22);
        }
        .panel-icon svg { width: 58%; height: 58%; }
        .auth-panel-head h2 {
            font-size: clamp(14px, 1.9vh, 21px); font-weight: 800; color: #f1f5f9; letter-spacing: 1.5px;
        }
        .auth-panel-head .panel-tag {
            display: inline-block;
            margin-top: clamp(3px, 0.7vh, 8px);
            font-size: clamp(8.5px, 1.05vh, 11px); font-weight: 700; letter-spacing: 2.2px;
            text-transform: uppercase;
            color: #b58a06;
            background: #fef6dd;
            border: 1px solid #f7e7ab;
            padding: clamp(2px, 0.5vh, 5px) 12px;
            border-radius: 999px;
        }
        .auth-panel-head .panel-hint {
            font-size: clamp(9.5px, 1.25vh, 13px); color: #94a3b8;
            margin-top: clamp(3px, 0.8vh, 12px);
        }

        .field { margin-bottom: clamp(7px, 1.5vh, 18px); }
        .field > label {
            display: block;
            font-size: clamp(9px, 1.15vh, 12px); font-weight: 700; color: #cbd5e1;
            letter-spacing: .6px; text-transform: uppercase;
            margin-bottom: clamp(3px, 0.7vh, 7px);
        }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-wrap .lead-icon {
            position: absolute; left: clamp(11px, 1.1vw, 15px);
            color: #94a3b8; pointer-events: none;
            display: flex; align-items: center;
        }
        .input-wrap input,
        .input-wrap select {
            width: 100%;
            padding: clamp(8px, 1.5vh, 14px) clamp(38px, 3.2vw, 46px);
            border: 1.5px solid rgba(255,255,255,.12);
            border-radius: 12px;
            background: rgba(255,255,255,.06);
            font-size: clamp(12.5px, 1.5vh, 14.5px);
            font-family: inherit;
            color: #f1f5f9;
            appearance: none;
            -webkit-appearance: none;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        .input-wrap select { padding-right: clamp(34px, 3vw, 42px); cursor: pointer; }
        .input-wrap .caret {
            position: absolute; right: 12px;
            color: #94a3b8; pointer-events: none;
            display: flex; align-items: center;
        }
        .input-wrap input::placeholder { color: #64748b; }
        .input-wrap input:focus,
        .input-wrap select:focus {
            outline: none;
            background: rgba(255,255,255,.1);
            border-color: #f5c520;
            box-shadow: 0 0 0 4px rgba(245,197,32,.18);
        }
        .toggle-pw {
            position: absolute; right: 6px;
            width: clamp(28px, 3.6vh, 34px); height: clamp(28px, 3.6vh, 34px);
            display: flex; align-items: center; justify-content: center;
            border: none; background: transparent;
            color: #94a3b8; border-radius: 9px;
            transition: color .2s, background .2s;
        }
        .toggle-pw:hover { color: #334155; background: #f1f5f9; }

        /* two-up field rows keep the taller register form inside one frame */
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1vw, 14px); }

        .panel-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin: 0 0 clamp(9px, 1.9vh, 24px);
            font-size: clamp(10.5px, 1.3vh, 13px);
        }
        .panel-remember label {
            display: flex; align-items: center; gap: 8px;
            color: #cbd5e1; cursor: pointer; user-select: none;
        }
        .panel-remember input[type="checkbox"] {
            width: clamp(14px, 1.8vh, 17px); height: clamp(14px, 1.8vh, 17px);
            accent-color: #f5c520; cursor: pointer;
        }
        .forgot-link {
            color: #b58a06; font-weight: 600; background: none; border: none;
            padding: 0; font-family: inherit; font-size: clamp(10.5px, 1.3vh, 13px);
        }
        .forgot-link:hover { color: #8f6c05; text-decoration: underline; }

        .signin-btn {
            width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: clamp(9px, 1.6vh, 16px) 20px;
            border: none; border-radius: 12px;
            background: linear-gradient(135deg, #f7cf3f, #f0b400);
            color: #14181f;
            font-size: clamp(12.5px, 1.6vh, 15px); font-weight: 800; letter-spacing: .6px;
            box-shadow: 0 10px 24px rgba(240,180,0,.38);
            transition: transform .12s, box-shadow .2s, filter .2s;
        }
        .signin-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(240,180,0,.48); filter: brightness(1.04); }
        .signin-btn:active { transform: translateY(0); }
        .signin-btn .arrow { transition: transform .2s; }
        .signin-btn:hover .arrow { transform: translateX(4px); }

        .panel-note {
            text-align: center;
            font-size: clamp(9px, 1.1vh, 11.5px); color: #64748b;
            margin-top: clamp(8px, 1.7vh, 22px); line-height: 1.6;
        }
        .panel-note a { color: #b58a06; font-weight: 600; }
        .panel-note a:hover { text-decoration: underline; }
        .forgot-hint {
            display: none;
            font-size: clamp(10px, 1.2vh, 12px); color: #8a6d05; background: #fef6dd;
            border: 1px solid #f7e7ab; border-radius: 10px;
            padding: clamp(6px, 1vh, 10px) 12px;
            margin-bottom: clamp(7px, 1.5vh, 18px); text-align: center;
        }
        .forgot-hint.show { display: block; }

        /* Auth split-screen responsive */
        @media (max-width: 1024px) {
            .auth-form-side { padding: 0; }
            .auth-panel { max-width: 420px; }
        }
        @media (max-width: 600px) {
            .auth-split { padding: 16px; }
            .auth-panel { border-radius: 16px; }
            .input-wrap input, .input-wrap select { padding-right: 40px; }
        }
        /* Extremely short viewports (landscape phones): tighten the rhythm only.
           Nothing is hidden — the brand column shrinks and the form column
           scrolls, so every element stays present and reachable. */
        @media (max-height: 520px) {
            .brand-copy h1 { font-size: clamp(18px, 4.2vh, 30px); }
            .brand-copy .brand-rule { margin: 5px 0; }
            .brand-chips { display: none; }
            .brand-foot { padding-top: 6px; }
            .auth-panel { padding-top: clamp(10px, 2vh, 20px); padding-bottom: clamp(8px, 1.6vh, 16px); }
        }
        /* ── Form groups (shared) ── */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--gray-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border .2s, box-shadow .2s;
            background: white;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,.15);
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: background .2s, transform .1s, box-shadow .2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary {
            background: linear-gradient(135deg, #f7cf3f, #f0b400);
            color: #14181f;
            box-shadow: 0 4px 14px rgba(240,180,0,.34);
        }
        .btn-primary:hover {
            box-shadow: 0 8px 20px rgba(240,180,0,.44);
            filter: brightness(1.04);
        }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #b45309; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-outline { background: white; color: var(--text); border: 1.5px solid var(--gray-border); }
        .btn-outline:hover { background: var(--gray); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* Flash messages */
        .flash-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 420px;
            width: calc(100% - 40px);
        }
        .flash {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.06);
            animation: flashIn .4s cubic-bezier(.175,.885,.32,1.275);
            position: relative;
            overflow: hidden;
        }
        .flash::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
        }
        .flash-success {
            background: #f0fdf4;
            color: #166534;
        }
        .flash-success::before { background: var(--success); }
        .flash-success .flash-icon { color: var(--success); }

        .flash-error {
            background: #fef2f2;
            color: #991b1b;
        }
        .flash-error::before { background: var(--danger); }
        .flash-error .flash-icon { color: var(--danger); }

        .flash-warning {
            background: #fffbeb;
            color: #92400e;
        }
        .flash-warning::before { background: var(--warning); }
        .flash-warning .flash-icon { color: var(--warning); }

        .flash-info {
            background: #ecfeff;
            color: #155e75;
        }
        .flash-info::before { background: var(--info); }
        .flash-info .flash-icon { color: var(--info); }

        .flash-icon {
            font-size: 18px;
            line-height: 1;
            flex-shrink: 0;
        }
        .flash-text { flex: 1; line-height: 1.4; }
        .flash-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: inherit;
            opacity: .5;
            padding: 0 2px;
            line-height: 1;
            transition: opacity .2s;
        }
        .flash-close:hover { opacity: 1; }
        @keyframes flashIn {
            from { opacity: 0; transform: translateX(40px) scale(.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes flashOut {
            to { opacity: 0; transform: translateX(40px) scale(.95); }
        }
        .flash.removing { animation: flashOut .3s ease forwards; pointer-events: none; }

        /* ── Sidebar layout ── */
        .layout { display: flex; height: 100vh; overflow: hidden; }
        .sidebar {
            width: 240px;
            color: #cbd5e1;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 100;
            background:
                radial-gradient(circle at 15% 0%, rgba(245,197,32,.16) 0%, transparent 48%),
                radial-gradient(circle at 100% 100%, rgba(37,99,235,.18) 0%, transparent 52%),
                linear-gradient(165deg, #0b0e13 0%, #131820 50%, #1a2029 100%);
            border-right: 1px solid rgba(255,255,255,.06);
            box-shadow: 10px 0 34px rgba(11,14,19,.28);
        }
        .sidebar::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }
        .sidebar::after {
            content: '';
            position: absolute;
            inset: -20% -60%;
            background: linear-gradient(105deg, transparent 44%, rgba(245,197,32,.07) 50%, transparent 56%);
            transform: rotate(10deg);
            pointer-events: none;
        }
        .sidebar > * { position: relative; z-index: 2; }
        .sidebar .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; padding: 0 8px; }
        .sidebar .brand .badge {
            width: 38px; height: 38px;
            background: linear-gradient(145deg, #f5c520, #d99b06);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 18px; color: white;
            overflow: hidden;
            padding: 4px;
            box-shadow: 0 8px 20px rgba(245,197,32,.30);
        }
        .sidebar .brand .badge img {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 7px;
            display: block;
        }
        .sidebar .brand h2 { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 1px; }
        .sidebar .brand small { display: block; font-size: 10px; color: #f5c520; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
        .sidebar nav { flex: 1; }
        .sidebar nav .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; padding: 12px 10px 6px; }
        .sidebar nav a {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
            transition: background .2s, color .2s, transform .15s;
            margin-bottom: 2px;
        }
        .sidebar nav a:hover { background: rgba(255,255,255,.08); color: white; transform: translateX(2px); }
        .sidebar nav a.active {
            background: linear-gradient(135deg, #f7cf3f, #f0b400);
            color: #14181f;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(240,180,0,.34);
        }
        .sidebar nav a .icon { font-size: 18px; width: 22px; text-align: center; }
        .sidebar .user-box {
            border-top: 1px solid rgba(255,255,255,.1);
            padding-top: 16px;
            margin-top: auto;
        }
        .sidebar .user-box .user-info { padding: 0 10px; margin-bottom: 10px; }
        .sidebar .user-box .user-info strong { display: block; color: white; font-size: 14px; }
        .sidebar .user-box .user-info span { font-size: 12px; color: #8b95a3; }

        /* ── Main content ── */
        .main { flex: 1; height: 100vh; margin-left: 240px; padding: 28px 36px; overflow-y: auto; }
        /* Frosted strip: a solid background here would sit as an opaque bar across
           the new page backdrop, so it blurs the content scrolling underneath. */
        .page-header {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
            margin: -28px -36px 28px;
            padding: 28px 36px 16px;
            background: rgba(238,242,247,.78);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            backdrop-filter: blur(12px) saturate(160%);
            border-bottom: 1px solid rgba(148,163,184,.28);
        }
        .page-header h1 { font-size: 26px; font-weight: 800; color: var(--dark); letter-spacing: -.5px; }
        .page-header p { font-size: 14px; color: var(--text-light); margin-top: 4px; }
        .page-header .actions { display: flex; gap: 10px; }

        /* Cards & stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .stat-card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, #ffffff 0%, #f7f9fc 100%);
            border: 1px solid rgba(226,232,240,.9);
            border-radius: var(--radius);
            padding: 20px 20px 20px 22px;
            box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 8px 22px rgba(15,23,42,.06);
            border-left: 4px solid var(--primary);
            transition: transform .18s, box-shadow .18s;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: -30%; right: -18%;
            width: 150px; height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(37,99,235,.10) 0%, transparent 68%);
            pointer-events: none;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 14px 30px rgba(15,23,42,.10); }
        .stat-card.green { border-left-color: var(--success); }
        .stat-card.green::after { background: radial-gradient(circle, rgba(22,163,74,.12) 0%, transparent 68%); }
        .stat-card.red { border-left-color: var(--danger); }
        .stat-card.red::after { background: radial-gradient(circle, rgba(220,38,38,.12) 0%, transparent 68%); }
        .stat-card.amber { border-left-color: var(--warning); }
        .stat-card.amber::after { background: radial-gradient(circle, rgba(217,119,6,.14) 0%, transparent 68%); }
        .stat-card.blue { border-left-color: var(--info); }
        .stat-card.blue::after { background: radial-gradient(circle, rgba(8,145,178,.12) 0%, transparent 68%); }
        .stat-card.purple { border-left-color: var(--purple); }
        .stat-card.purple::after { background: radial-gradient(circle, rgba(124,58,237,.12) 0%, transparent 68%); }
        .stat-card .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); position: relative; }
        .stat-card .value { font-size: 30px; font-weight: 800; color: var(--dark); margin-top: 6px; letter-spacing: -1px; position: relative; }
        .stat-card .sub { font-size: 12px; color: var(--text-light); margin-top: 4px; position: relative; }

        .card {
            background: linear-gradient(165deg, #ffffff 0%, #fbfcfe 100%);
            border: 1px solid rgba(226,232,240,.9);
            border-radius: var(--radius);
            box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 10px 26px rgba(15,23,42,.07);
            padding: 24px;
            margin-bottom: 24px;
        }
        .card h3 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; }
        .chart-box {
            position: relative;
            overflow: hidden;
            background: linear-gradient(165deg, #ffffff 0%, #fbfcfe 100%);
            border: 1px solid rgba(226,232,240,.9);
            border-radius: var(--radius);
            box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 10px 26px rgba(15,23,42,.07);
            padding: 24px;
        }
        /* thin gold-to-blue top edge ties the charts to the brand */
        .chart-box::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 3px;
            background: linear-gradient(90deg, #f5c520, #f0b400 40%, rgba(37,99,235,.85) 100%);
            opacity: .85;
        }
        .chart-box h3 { font-size: 15px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }
        .chart-box canvas { max-height: 280px; }

        /* Tables */
        .table-wrap { overflow: auto; max-height: 400px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead th {
            text-align: left;
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-light);
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-bottom: 2px solid var(--gray-border);
            white-space: nowrap;
        }
        tbody td { padding: 14px; border-bottom: 1px solid var(--gray-border); vertical-align: middle; }
        tbody tr:hover { background: #f8fafc; }
        tbody tr:last-child td { border-bottom: none; }

        /* Scrollable table - vertical & horizontal scroll, 5 rows visible */
        .table-scroll {
            overflow: auto;
            max-height: 290px;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
        }
        .table-scroll table { border-collapse: separate; border-spacing: 0; }
        .table-scroll thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 1px 0 var(--gray-border);
        }
        tbody tr:nth-child(even) { background: #fafbfc; }

        /* HOD Summary - fix table (no horizontal scroll), remove page-level vertical scroll */
        .hod-summary-page .table-scroll { overflow-x: hidden; }
        .hod-summary-page .main { overflow-y: hidden; }

        /* HOD Summary table enhancements */
        .table-scroll table { box-shadow: 0 1px 3px rgba(0,0,0,.04); }
        .table-scroll thead th {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: var(--dark);
            font-size: 11px;
        }
        .table-scroll tbody td {
            padding: 12px 14px;
            font-size: 14px;
        }
        /* Column widths - scoped to HOD Summary only (4-column layout) */
        .hod-summary-page .table-scroll tbody td:nth-child(1) { width: 40%; }
        .hod-summary-page .table-scroll tbody td:nth-child(2),
        .hod-summary-page .table-scroll tbody td:nth-child(3),
        .hod-summary-page .table-scroll tbody td:nth-child(4) { width: 20%; text-align: center; }
        .hod-summary-page .table-scroll thead th:nth-child(2),
        .hod-summary-page .table-scroll thead th:nth-child(3),
        .hod-summary-page .table-scroll thead th:nth-child(4) { text-align: center; }
        .table-scroll .badge { font-size: 12px; font-weight: 700; }
        .table-scroll tbody tr:hover { background: #f0f7ff; }
        .table-scroll tbody tr:hover .link-btn { background: var(--primary-light); }

        /* Editable audit table cells */
        .cell-input {
            width: 100%;
            min-width: 110px;
            padding: 7px 9px;
            border: 1.5px solid var(--gray-border);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: #fff;
        }
        .cell-input:focus { outline: none; border-color: var(--primary); }
        .cell-file { max-width: 130px; font-size: 11px; }
        .new-audit-row td { background: #f0fdf4; }
        .new-audit-row .cell-input { border-color: #86efac; }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-open { background: var(--danger-light); color: #991b1b; }
        .badge-closed { background: var(--success-light); color: #166534; }
        .badge-plant1 { background: #dbeafe; color: #1e40af; }
        .badge-plant2 { background: #fef3c7; color: #92400e; }
        .badge-plant3 { background: #fce7f3; color: #9d174d; }
        .badge-compliant { background: var(--success-light); color: #166534; }
        .badge-violation { background: var(--danger-light); color: #991b1b; }
        .badge-admin { background: var(--primary-light); color: var(--primary-dark); }
        .badge-coordinator { background: var(--info-light); color: #155e75; }
        .badge-active { background: var(--success-light); color: #166534; }
        .badge-inactive { background: #e2e8f0; color: #475569; }
        .badge-pending { background: var(--warning-light); color: #92400e; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
        .empty-state .icon { font-size: 44px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        .link-btn {
            background: none; border: none;
            color: #b58a06; font-size: 13px; font-weight: 600;
            padding: 4px 8px; border-radius: 6px;
            transition: background .2s, color .2s;
        }
        .link-btn:hover { background: #fef6dd; color: #8f6c05; }
        .link-btn.danger { color: var(--danger); }
        .link-btn.danger:hover { background: var(--danger-light); }

        .alerts-list { display: flex; flex-direction: column; gap: 8px; }
        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #fff7ed;
            border-left: 4px solid var(--warning);
            padding: 12px 14px;
            border-radius: 8px;
        }
        .alert-item.resolved { background: var(--success-light); border-left-color: var(--success); }
        .alert-item .alert-icon { font-size: 20px; line-height: 1.4; }
        .alert-item .alert-content { flex: 1; min-width: 0; }
        .alert-item .alert-content strong { font-size: 13px; color: var(--dark); display: block; margin-bottom: 2px; }
        .alert-item .alert-content span { font-size: 12px; color: var(--text-light); display: block; }
        .alert-item .alert-content .alert-meta { margin-top: 4px; font-size: 11px; color: #94a3b8; }
        .alert-item .alert-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .alerts-scroll {
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 310px;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            padding: 10px;
        }
        .alerts-scroll .alerts-list { gap: 10px; }
        .alerts-scroll .alert-item { transition: transform .15s, box-shadow .15s; }
        .alerts-scroll .alert-item:hover { transform: translateX(2px); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .alerts-scroll .alert-item:nth-child(even) { background: #fefef8; }
        /* Alerts page - remove page-level vertical scroll */
        .alerts-page .main { overflow-y: hidden; }

        .rule-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .rule-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 22px;
            border-top: 4px solid var(--primary);
            transition: transform .2s, box-shadow .2s;
        }
        .rule-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .rule-card h4 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
        .rule-card .meta { font-size: 13px; color: var(--text-light); margin-bottom: 6px; }
        .rule-card .meta strong { color: var(--text); }
        .rule-card .rule-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gray-border); }

        .counts-inline {
            display: flex; gap: 16px; margin-top: 10px;
            font-size: 13px;
        }
        .counts-inline span { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-red { background: var(--danger); }
        .dot-green { background: var(--success); }
        .dot-amber { background: var(--warning); }

        @media (max-width: 1024px) {
            .sidebar { width: 60px; padding: 24px 10px; }
            .sidebar .brand h2, .sidebar .brand small, .sidebar .nav-label, .sidebar nav a span:not(.icon), .sidebar .user-info { display: none; }
            .sidebar nav a { justify-content: center; }
            .main { margin-left: 60px; padding: 24px 16px; }
            /* the header bleeds to the edges, so its offsets must track .main padding */
            .page-header { margin: -24px -16px 24px; padding: 24px 16px 14px; }
            .charts-grid { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .page-header .actions { width: 100%; justify-content: flex-end; }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 280px;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: var(--shadow-lg);
            }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 16px; height: 100vh; min-height: 100vh; padding-top: 72px; overflow-y: auto; }
            .page-header { margin: -72px -16px 20px; padding: 72px 16px 14px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .stat-card .value { font-size: 24px; }
            .rule-cards { grid-template-columns: 1fr; }
            .charts-grid { grid-template-columns: 1fr; }
            .table-wrap, .table-scroll { border: none; }
            thead { display: none; }
            tbody, tbody tr, tbody td { display: block; width: 100%; }
            .hod-summary-page .table-scroll tbody td:nth-child(1),
            .hod-summary-page .table-scroll tbody td:nth-child(2),
            .hod-summary-page .table-scroll tbody td:nth-child(3),
            .hod-summary-page .table-scroll tbody td:nth-child(4) { width: 100%; }
            tbody tr { margin-bottom: 16px; padding: 16px; background: white; border-radius: var(--radius); box-shadow: var(--shadow); }
            tbody td { padding: 8px 0; border-bottom: 1px solid var(--gray-border); display: flex; justify-content: space-between; align-items: center; }
            tbody td:last-child { border-bottom: none; }
            tbody td::before { content: attr(data-label); font-weight: 600; color: var(--text-light); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
            .alert-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .alert-item .alert-actions { width: 100%; justify-content: flex-end; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .page-header .actions { width: 100%; justify-content: flex-end; }
            .flash-container { top: 10px; right: 10px; left: 10px; max-width: none; width: auto; }
            .form-group input, .form-group select, .form-group textarea { font-size: 16px; }
            .modal-box { margin: 10px; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .stat-card { padding: 16px; }
            .stat-card .value { font-size: 22px; }
            .card, .chart-box { padding: 16px; }
            .page-header h1 { font-size: 20px; }
            .sidebar { width: 100%; max-width: 280px; }
            .btn { padding: 12px 16px; }
            .btn-sm { padding: 8px 12px; font-size: 13px; }
            .rule-card { padding: 16px; }
            .form-group input, .form-group select, .form-group textarea { padding: 14px 16px; }
            .flash { padding: 12px 14px; }
        }

        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 200;
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #131820, #0b0e13);
            color: #f5c520;
            border: 1px solid rgba(245,197,32,.28);
            border-radius: 10px;
            font-size: 20px;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(11,14,19,.35);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.5);
            z-index: 99;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }
        @media (max-width: 768px) {
            .mobile-menu-btn { display: flex; }
        }
        .auth-body .mobile-menu-btn { display: none !important; }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed; inset: 0;
            background: rgba(255,255,255,.85);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(2px);
        }
        .loading-overlay.active { display: flex; }
        .loading-spinner {
            width: 48px; height: 48px;
            border: 4px solid var(--gray-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text { font-size: 14px; font-weight: 600; color: var(--text); }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Confirm Modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(15,23,42,.5);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.active { display: flex; animation: fadeIn .2s ease; }
        .modal-box {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,.25);
            width: 100%; max-width: 400px;
            padding: 28px;
            text-align: center;
            animation: scaleIn .25s cubic-bezier(.175,.885,.32,1.275);
        }
        .modal-box .modal-icon { font-size: 48px; margin-bottom: 14px; }
        .modal-box h3 { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
        .modal-box p { font-size: 14px; color: var(--text-light); margin-bottom: 22px; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-actions .btn { min-width: 100px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block mobile_menu_btn %}
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    {% endblock %}
    <div id="app">
    {% block content %}{% endblock %}
    </div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading...</div>
    </div>
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <h3>Confirm Delete</h3>
            <p id="confirmModalText">Are you sure you want to delete this?</p>
            <div class="modal-actions">
                <button class="btn btn-outline" id="confirmModalCancel">Cancel</button>
                <button class="btn btn-danger" id="confirmModalOk">Delete</button>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            function showLoading() {
                if (loadingOverlay) loadingOverlay.classList.add('active');
            }
            function hideLoading() {
                if (loadingOverlay) loadingOverlay.classList.remove('active');
            }
            window.addEventListener('load', hideLoading);
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                if (!link) return;
                if (link.classList.contains('no-loading')) return;
                if (link.getAttribute('href') && link.getAttribute('href').startsWith('#')) return;
                if (link.getAttribute('target') === '_blank') return;
                if (link.getAttribute('role') === 'button' && link.getAttribute('data-bs-toggle') === 'collapse') return;
                showLoading();
            });
            document.addEventListener('submit', function(e) {
                const form = e.target;
                if (form && !form.classList.contains('no-loading')) {
                    showLoading();
                }
            });

            function removeFlash(el) {
                if (el.classList.contains('removing')) return;
                el.classList.add('removing');
                el.addEventListener('animationend', () => el.remove());
            }

            let pendingForm = null;
            const modal = document.getElementById('confirmModal');
            const modalText = document.getElementById('confirmModalText');
            const btnOk = document.getElementById('confirmModalOk');
            const btnCancel = document.getElementById('confirmModalCancel');

            function bindConfirm(root) {
                root.querySelectorAll('[data-confirm]').forEach(btn => {
                    if (btn.dataset.confirmBound) return;
                    btn.dataset.confirmBound = '1';
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        pendingForm = this.closest('form');
                        modalText.textContent = this.getAttribute('data-confirm') || 'Are you sure?';
                        modal.classList.add('active');
                    });
                });
            }

            function bindSidebarNav(root) {
                const side = root.querySelector('.sidebar');
                if (!side || side.dataset.navBound) return;
                side.dataset.navBound = '1';
                side.querySelectorAll('nav a').forEach(link => {
                    link.addEventListener('click', function() {
                        if (window.innerWidth <= 768) {
                            side.classList.remove('open');
                            const ov = document.getElementById('sidebarOverlay');
                            if (ov) ov.classList.remove('active');
                        }
                    });
                });
            }

            function initPage(root) {
                root.querySelectorAll('.flash').forEach(f => {
                    if (f.dataset.flashBound) return;
                    f.dataset.flashBound = '1';
                    const closeBtn = f.querySelector('.flash-close');
                    if (closeBtn) closeBtn.addEventListener('click', () => removeFlash(f));
                    setTimeout(() => removeFlash(f), 4000);
                });
                bindConfirm(root);
                bindSidebarNav(root);
            }

            window.YG1 = { initPage: initPage, removeFlash: removeFlash };
            initPage(document);

            // Page scripts call this instead of DOMContentLoaded. On a cold load it
            // defers until the DOM is parsed; after a partial swap the DOM is
            // already ready so it runs at once. { once: true } means a swapped-out
            // page can never strand a listener on document.
            window.YG1.onReady = function(fn) {
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', fn, { once: true });
                } else {
                    fn();
                }
            };

            btnOk.addEventListener('click', function() {
                if (pendingForm) pendingForm.submit();
            });
            btnCancel.addEventListener('click', function() {
                modal.classList.remove('active');
                pendingForm = null;
            });
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.classList.remove('active');
                    pendingForm = null;
                }
            });

            // Mobile sidebar toggle
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const sidebar = document.querySelector('.sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            
            if (mobileMenuBtn && sidebar && sidebarOverlay) {
                mobileMenuBtn.addEventListener('click', function() {
                    sidebar.classList.toggle('open');
                    sidebarOverlay.classList.toggle('active');
                });
                sidebarOverlay.addEventListener('click', function() {
                    sidebar.classList.remove('open');
                    sidebarOverlay.classList.remove('active');
                });
            }
        })();
    </script>
    <script>
    (function() {
        if (window.__pjaxBooted) return;
        window.__pjaxBooted = true;

        const app = document.getElementById('app');
        if (!app) return;
        // The #page-scripts host is declared after this script, so resolve it lazily.
        const getScriptHost = () => document.getElementById('page-scripts');

        function destroyCharts() {
            if (!window.Chart || !Chart.instances) return;
            Object.keys(Chart.instances).forEach(k => {
                try { Chart.instances[k].destroy(); } catch (e) {}
            });
        }

        // flatpickr mounts its calendar on <body>, outside #app, so swapping the app
        // markup would otherwise strand a stale calendar over the new page.
        function destroyDatepickers() {
            document.querySelectorAll('.flatpickr-calendar, .flatpickr-calendar-container')
                .forEach(el => el.parentNode && el.parentNode.removeChild(el));
            document.querySelectorAll('.flatpickr-input').forEach(input => {
                input.classList.remove('flatpickr-input');
                if (input._flatpickr && input._flatpickr.destroy) {
                    try { input._flatpickr.destroy(); } catch (e) {}
                }
            });
        }

        // Scripts must be inserted into the LIVE document. A script node created
        // inside the DOMParser document never runs, because that document has no
        // browsing context.
        function runScripts(parsed) {
            const host = getScriptHost();
            if (!host) return;
            Array.from(parsed.querySelectorAll('script')).forEach(old => {
                const s = document.createElement('script');
                for (const attr of old.attributes) {
                    if (attr.name === 'src') s.setAttribute('src', attr.value);
                    else if (attr.name !== 'type') s.setAttribute(attr.name, attr.value);
                }
                s.textContent = old.textContent;
                old.remove();
                host.appendChild(s);
            });
        }

        function syncActiveNav() {
            const path = window.location.pathname;
            document.querySelectorAll('.sidebar nav a').forEach(a => {
                const href = a.getAttribute('href');
                if (!href) return;
                let match = false;
                try {
                    const u = new URL(href, window.location.origin);
                    match = u.pathname === path ||
                             (u.pathname !== '/' && path.startsWith(u.pathname + '/'));
                } catch (e) { return; }
                a.classList.toggle('active', match);
            });
        }

        function swap(doc) {
            const newApp = doc.getElementById('app');
            if (!newApp) return false;
            // Auth screens are not part of the app shell; let the browser load them.
            if (doc.querySelector('.auth-split')) return false;

            destroyCharts();
            destroyDatepickers();

            // Carry over flashes produced by the redirect we just followed.
            const carried = document.createElement('div');
            const incomingFlash = newApp.querySelector('.flash-container');
            if (incomingFlash) carried.innerHTML = incomingFlash.outerHTML;
            else {
                const stale = document.querySelector('.flash-container');
                if (stale) stale.remove();
            }

            app.innerHTML = newApp.innerHTML;
            if (carried.firstElementChild) app.insertBefore(carried.firstElementChild, app.firstChild);

            const host = getScriptHost();
            if (host) host.innerHTML = '';
            const newScripts = doc.getElementById('page-scripts');
            if (newScripts) runScripts(newScripts);

            document.body.className = doc.body.className || '';
            document.title = doc.title;

            const main = app.querySelector('.main');
            if (main) main.scrollTop = 0;

            if (window.YG1) window.YG1.initPage(app);
            return true;
        }

        let busy = false;

        async function navigate(url, push) {
            if (busy) return;
            busy = true;
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.classList.add('active');
            try {
                const res = await fetch(url, {
                    headers: { 'X-PJAX': '1', 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'same-origin',
                    redirect: 'follow'
                });
                if (!res.ok) { window.location.href = url; return; }
                // Session expiry lands on the login screen; hand off to a real load.
                if (res.redirected && new URL(res.url).pathname === '/login') {
                    window.location.href = res.url;
                    return;
                }
                const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
                if (!swap(doc)) { window.location.href = url; return; }
                // Update the URL before syncing the sidebar, otherwise the highlight
                // is matched against the page we are leaving.
                if (push) history.pushState({ pjax: true }, '', url);
                syncActiveNav();
            } catch (err) {
                window.location.href = url;
            } finally {
                busy = false;
                const ov = document.getElementById('loadingOverlay');
                if (ov) ov.classList.remove('active');
            }
        }

        document.addEventListener('click', function(e) {
            if (e.defaultPrevented || e.button !== 0) return;
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            const link = e.target.closest && e.target.closest('a[href]');
            if (!link) return;
            if (link.hasAttribute('download') || link.getAttribute('target')) return;
            if (link.classList.contains('no-loading')) return;
            if (link.getAttribute('role') === 'button') return;
            const href = link.getAttribute('href');
            if (!href || href.startsWith('#')) return;
            const url = new URL(link.href, window.location.origin);
            if (url.origin !== window.location.origin) return;
            if (url.pathname === '/logout') return;
            e.preventDefault();
            navigate(url.href, true);
        });

        window.addEventListener('popstate', function() {
            navigate(window.location.href, false);
        });
    })();
    </script>
    <div id="page-scripts">
    {% block scripts %}{% endblock %}
    </div>
</body>
</html>
